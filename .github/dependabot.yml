version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels: [dependencies]
    groups:
      radix:
        patterns: ["@radix-ui/*"]
      testing:
        patterns: ["@testing-library/*", "vitest", "@vitest/*", "jsdom", "msw"]
    ignore:
      # Bumped by hand alongside the api and the ledger. Never automatically.
      - dependency-name: "@payzeno/contracts"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"
