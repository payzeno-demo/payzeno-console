name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20.11.1'
  PNPM_VERSION: '9.1.1'

jobs:
  build:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # @payzeno/contracts is a workspace sibling. Without the workspace root, install
          # fails at resolution rather than at build, which is a confusing error to debug.
          fetch-depth: 0

      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build contracts
        run: pnpm --filter @payzeno/contracts build

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test:coverage
        env:
          # The 70% gate lives in vitest.config.ts, not here. tests.md §5.
          CI: 'true'

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

      - name: Build
        run: pnpm build
        env:
          VITE_PAYZENO_API_URL: http://localhost/v1
          VITE_WS_URL: ws://localhost/ws/notifications
          VITE_VAULT_PUBLIC_URL: http://localhost:8099/public
          VITE_ENVIRONMENT: qa
          VITE_FEATURE_SETTLEMENT_EXPLORER: 'true'
          VITE_FEATURE_DISPUTE_EVIDENCE_V2: 'true'
          GIT_SHA: ${{ github.sha }}

      - name: Bundle budget
        run: |
          set -euo pipefail
          BYTES=$(du -sb dist/assets | cut -f1)
          echo "assets: $BYTES bytes"
          # 3.5 MiB uncompressed. Raised twice; raise it again only with a reason in the PR.
          if [ "$BYTES" -gt 3670016 ]; then
            echo "::error::bundle over budget — check what you imported into the root chunk"
            exit 1
          fi

  openapi-contract:
    name: contract · api routes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # src/api/contract/routes.contract.test.ts asserts every path our endpoints build
      # exists in payzeno-api's published OpenAPI. This step refreshes the checked-in copy
      # so a drifted route fails HERE and not in a merchant's browser.
      - name: Refresh payzeno-api OpenAPI
        run: pnpm openapi:pull
        env:
          PAYZENO_API_OPENAPI_URL: ${{ vars.PAYZENO_API_OPENAPI_URL }}

      - name: Fail on drift
        run: |
          if ! git diff --quiet -- src/api/openapi/payzeno-api.openapi.json; then
            echo "::warning::payzeno-api's OpenAPI moved. Commit the refreshed file."
            git --no-pager diff --stat -- src/api/openapi/
          fi

      - name: Contract test
        run: pnpm vitest run src/api/contract

  docker:
    name: docker build
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Check out the workspace sibling
        uses: actions/checkout@v4
        with:
          repository: payzeno/payzeno-contracts
          path: ../payzeno-contracts

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: ..
          file: payzeno-console/Dockerfile
          push: false
          tags: payzeno/console:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_ENVIRONMENT=qa
            GIT_SHA=${{ github.sha }}
