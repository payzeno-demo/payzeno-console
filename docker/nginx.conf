# Static serve only. Every /v1 and /ws request is routed by payzeno-nginx (the ingress),
# not by this container — do NOT add a proxy_pass here, it will shadow the ingress rules and
# the ^/internal/ deny lives up there.

server {
    listen 8082;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    # The SPA owns its routes. Anything that is not a real file falls through to index.html
    # so a deep link like /settlements/setb_.../items reloads correctly.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
    }

    # Hashed assets are immutable by construction.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Sourcemaps ship to Sentry, never to the browser.
    location ~* \.map$ {
        return 404;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
