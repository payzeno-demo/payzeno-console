# Console-only compose. The real topology lives in payzeno-infrastructure/docker-compose.yml;
# this file exists so you can `docker compose up` from inside this repo without cloning infra
# for anything except the ingress.
#
# GOTCHA: the root compose declares `build: { context: ../payzeno-console }`. That context
# cannot resolve `@payzeno/contracts: workspace:*`, so we widen it to the workspace root here
# and point at this repo's Dockerfile explicitly. Do not "fix" the root file — payzeno-api
# has the same shape and infra owns it. PAY-1774.

services:
  payzeno-console:
    extends:
      file: ../payzeno-infrastructure/docker-compose.yml
      service: payzeno-console
    build:
      context: ..
      dockerfile: payzeno-console/Dockerfile
      args:
        VITE_PAYZENO_API_URL: http://localhost/v1
        VITE_WS_URL: ws://localhost/ws/notifications
        VITE_VAULT_PUBLIC_URL: http://localhost:8099/public
        VITE_ENVIRONMENT: local
        VITE_FEATURE_SETTLEMENT_EXPLORER: "true"
        VITE_FEATURE_DISPUTE_EVIDENCE_V2: "false"
        GIT_SHA: ${GIT_SHA:-local}
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
